<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignalBot — Setup</title>
  <link rel="stylesheet" href="{{ base_path }}/static/css/portal.css">
</head>
<body class="auth-page">
  <div style="width:min(480px,100%); position:relative; z-index:1;">
    <form class="auth-card" method="post" action="{{ base_path }}/setup">
      <div class="auth-card-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h2>Create portal admin</h2>
      <p class="sub">First run — set the username and password for this portal. Stored as a hash in <code>.env</code>.</p>
      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

      <label class="form-label" for="username">Username</label>
      <input id="username" name="username" class="form-control" value="admin" required autofocus>

      <div style="height:12px"></div>
      <label class="form-label" for="password">Password (min 8 chars)</label>
      <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required minlength="8">

      <div style="height:12px"></div>
      <label class="form-label" for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" class="form-control" autocomplete="new-password" required minlength="8">

      <button class="btn btn-primary" type="submit" style="width:100%;margin-top:20px;">Create account</button>
    </form>
  </div>
</body>
</html>
