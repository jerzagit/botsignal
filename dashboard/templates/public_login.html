<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignalBot — Public Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
  <div class="bg-gray-800 rounded-xl p-8 w-full max-w-sm shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white">SignalBot</h1>
      <p class="text-gray-400 text-sm mt-1">Live Trading Dashboard</p>
    </div>

    {% if error %}
    <div class="bg-red-900/50 text-red-300 text-sm rounded px-4 py-2 mb-4 text-center">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <input type="password" name="token" placeholder="Access token"
             class="w-full px-4 py-3 rounded bg-gray-700 text-white border border-gray-600 focus:border-blue-500 focus:outline-none mb-4"
             autofocus>
      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded transition">
        Enter Dashboard
      </button>
    </form>

    <p class="text-gray-500 text-xs text-center mt-4">
      Authorized access only
    </p>
  </div>
</body>
</html>
