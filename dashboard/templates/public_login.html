<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignalBot — Public Dashboard</title>
  <link rel="stylesheet" href="/static/css/portal.css">
</head>
<body class="auth-page">
  <form class="auth-card" method="POST" action="/login" style="width:min(400px,92vw);">
    <div class="auth-card-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
    </div>
    <h2>SignalBot</h2>
    <p class="sub">Live Trading Dashboard — authorized access only.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <label class="form-label" for="token">Access token</label>
    <input id="token" type="password" name="token" class="form-control" placeholder="Access token" autofocus>
    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:18px;">Enter Dashboard</button>
  </form>
</body>
</html>
